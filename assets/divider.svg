<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 40" width="1000" height="40" role="img" aria-label="Divisor animado">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff1e2d" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ff1e2d"/>
      <stop offset="80%" stop-color="#ff1e2d"/>
      <stop offset="100%" stop-color="#ff1e2d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="19" width="1000" height="2" fill="url(#fade)"/>

  <!-- losango central com brilho de vela -->
  <circle cx="500" cy="20" r="18" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.6;0.95;0.55" dur="2s" repeatCount="indefinite"/>
  </circle>
  <polygon points="500,8 512,20 500,32 488,20" fill="#0a0a0a" stroke="#c9a66b" stroke-width="2"/>
  <polygon points="500,15 505,20 500,25 495,20" fill="#ff8a1f">
    <animate attributeName="opacity" values="1;0.5;1;0.7;1" dur="1.6s" repeatCount="indefinite"/>
  </polygon>

  <!-- pulso que percorre a linha -->
  <rect x="0" y="18" width="80" height="4" fill="#fff" opacity="0.85">
    <animate attributeName="x" values="-80;1000" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
