<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Banner animado">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#0a0a0a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="candle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#ff7a1a" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff1e2d"/>
      <stop offset="100%" stop-color="#a8000f"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#fff" opacity="0.05"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="300"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- fundo -->
    <rect width="1000" height="300" fill="#0a0a0a"/>

    <!-- formas inclinadas (estilo HUD vermelho/preto) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="-760 0; 0 0; 0 0; -760 0" keyTimes="0;0.10;0.90;1" dur="12s"
        calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 1 1;0.8 0 0.8 0.2" repeatCount="indefinite"/>
      <polygon points="-60,0 640,0 540,300 -60,300" fill="url(#red)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="-900 0; -900 0; 0 0; 0 0; -900 0" keyTimes="0;0.04;0.15;0.90;1" dur="12s"
        calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1;0 0 1 1;0.8 0 0.8 0.2" repeatCount="indefinite"/>
      <polygon points="-60,0 470,0 390,300 -60,300" fill="#0a0a0a"/>
      <polygon points="470,0 492,0 412,300 390,300" fill="#fff"/>
    </g>
    <g opacity="0.9">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 14 0; 0 0" dur="6s" repeatCount="indefinite"/>
      <polygon points="560,0 590,0 490,300 460,300" fill="#ff1e2d" opacity="0.55"/>
    </g>

    <!-- textos -->
    <g transform="translate(60 150) skewX(-12)">
      <text x="5" y="5" font-family="Impact, 'Arial Black', sans-serif" font-size="78" fill="#ff1e2d" letter-spacing="2">RYAN RAMOS</text>
      <text x="0" y="0" font-family="Impact, 'Arial Black', sans-serif" font-size="78" fill="#fff" letter-spacing="2">RYAN RAMOS
        <animate attributeName="opacity" values="1;1;0.85;1;1;0.9;1" dur="5s" repeatCount="indefinite"/>
      </text>
    </g>
    <g transform="translate(64 195) skewX(-12)">
      <rect x="-8" y="-22" width="300" height="32" fill="#fff"/>
      <text x="4" y="2" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#0a0a0a" letter-spacing="3">BACK-END // NODE // LOGIC</text>
    </g>

    <!-- carta com vela (estilo carta/vela) -->
    <g transform="translate(790 150)">
      <circle r="150" fill="url(#candle)">
        <animate attributeName="opacity" values="0.7;1;0.6;0.95;0.75;1;0.7" dur="2.3s" repeatCount="indefinite"/>
        <animate attributeName="r" values="140;155;135;150;142;156;140" dur="2.3s" repeatCount="indefinite"/>
      </circle>
      <rect x="-82" y="-112" width="164" height="224" rx="10" fill="#1a120c" stroke="#c9a66b" stroke-width="3"/>
      <rect x="-70" y="-100" width="140" height="200" rx="6" fill="none" stroke="#c9a66b" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>
      <!-- vela -->
      <rect x="-14" y="10" width="28" height="64" rx="3" fill="#e8dcc0"/>
      <rect x="-14" y="10" width="28" height="8" fill="#cbbd9a"/>
      <rect x="-1.5" y="-4" width="3" height="16" fill="#2a1b10"/>
      <!-- chama -->
      <g transform="translate(0 -6)">
        <animateTransform attributeName="transform" type="scale" additive="sum"
          values="1 1; 1.08 0.92; 0.94 1.1; 1.05 0.96; 1 1" dur="1.4s" repeatCount="indefinite"/>
        <path d="M0,-34 C14,-14 16,2 0,14 C-16,2 -14,-14 0,-34Z" fill="#ff8a1f"/>
        <path d="M0,-18 C7,-8 8,0 0,8 C-8,0 -7,-8 0,-18Z" fill="#ffe08a"/>
      </g>
      <!-- cantos -->
      <text x="-66" y="-84" font-family="'Courier New', monospace" font-size="16" fill="#c9a66b">&#9670;</text>
      <text x="50" y="-84" font-family="'Courier New', monospace" font-size="16" fill="#c9a66b">&#9670;</text>
      <text x="-66" y="94" font-family="'Courier New', monospace" font-size="16" fill="#c9a66b">&#9670;</text>
      <text x="50" y="94" font-family="'Courier New', monospace" font-size="16" fill="#c9a66b">&#9670;</text>
      <!-- brasas subindo -->
      <circle cx="-10" cy="-30" r="2" fill="#ffb347">
        <animate attributeName="cy" values="-30;-100" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="8" cy="-34" r="1.5" fill="#ff8a1f">
        <animate attributeName="cy" values="-34;-104" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-30" r="1.8" fill="#ffe08a">
        <animate attributeName="cy" values="-30;-96" dur="3.6s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="3.6s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- scanlines + vinheta -->
    <rect width="1000" height="300" fill="url(#scan)"/>
    <rect width="1000" height="300" fill="url(#vignette)"/>
    <!-- bordas -->
    <rect x="3" y="3" width="994" height="294" fill="none" stroke="#ff1e2d" stroke-width="2" opacity="0.8"/>
  </g>
</svg>
